<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel Administrativo — Libras nas Comunidades</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --azul-marinho: #0F2B4C; --azul-claro: #1E4E8C; --dourado: #A88552;
      --off-white: #F8FAFC; --branco: #FFFFFF; --texto: #334155;
      --texto-leve: #64748B; --borda: #E2E8F0; --perigo: #EF4444;
      --fonte-titulo: 'Playfair Display', serif; --fonte-corpo: 'Inter', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--fonte-corpo); background: var(--off-white); color: var(--texto); display: flex; height: 100vh; overflow: hidden; }
    
    /* Login */
    .login-overlay { position: fixed; inset: 0; background: var(--azul-marinho); display: flex; align-items: center; justify-content: center; z-index: 9999; }
    .login-box { background: var(--branco); padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; border-top: 4px solid var(--dourado); }
    .login-box h2 { font-family: var(--fonte-titulo); color: var(--azul-marinho); margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; margin-bottom: 5px; color: var(--azul-marinho); }
    .form-group input { width: 100%; padding: 12px; border: 1px solid var(--borda); border-radius: 6px; background: var(--off-white); outline: none; }
    
    /* Layout */
    .sidebar { width: 250px; background: var(--azul-marinho); color: #fff; padding: 24px; display: flex; flex-direction: column; }
    .sidebar h2 { font-family: var(--fonte-titulo); font-size: 1.2rem; margin-bottom: 30px; color: #fff;}
    .main-content { flex: 1; padding: 32px; overflow-y: auto; }
    
    .card { background: #fff; padding: 24px; border-radius: 8px; border: 1px solid var(--borda); box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 24px; }
    .card h3 { font-family: var(--fonte-titulo); color: var(--azul-marinho); margin-bottom: 20px; font-size: 1.4rem; }
    
    .btn { padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; transition: 0.2s; }
    .btn-dourado { background: var(--dourado); color: #fff; width: 100%; }
    .btn-dourado:hover { background: #8E6D3E; }
    .btn-perigo { background: #FEE2E2; color: var(--perigo); padding: 8px 12px; font-size: 0.8rem; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--borda); font-size: 0.9rem; }
    th { font-size: 0.75rem; text-transform: uppercase; color: var(--texto-leve); background: var(--off-white); }
    
    .hidden { display: none !important; }
    #erro-login { color: var(--perigo); font-size: 0.8rem; text-align: center; margin-top: 10px; display: block; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="login-overlay" id="login-screen">
    <div class="login-box">
      <h2>Acesso Restrito</h2>
      <div class="form-group">
        <label>E-mail Administrativo</label>
        <input type="email" id="inp-email" placeholder="seu@email.com">
      </div>
      <div class="form-group">
        <label>Senha</label>
        <input type="password" id="inp-senha" placeholder="********">
      </div>
      <button class="btn btn-dourado" id="btn-login">Entrar no Sistema</button>
      <span id="erro-login"></span>
    </div>
  </div>

  <!-- PAINEL -->
  <div id="app-painel" class="hidden" style="display: flex; width: 100%;">
    <aside class="sidebar">
      <h2>Secretaria Digital</h2>
      <div style="flex: 1;"></div>
      <button class="btn" style="background: rgba(255,255,255,0.1); color: #fff;" id="btn-sair">Sair do Sistema</button>
    </aside>

    <main class="main-content">
      <div class="card">
        <h3>Gerenciar Aulas</h3>
        
        <!-- Formulário -->
        <div style="background: var(--off-white); padding: 20px; border-radius: 6px; margin-bottom: 20px;">
          <input type="hidden" id="edit-id">
          <div class="form-group">
            <label>Título da Aula</label>
            <input type="text" id="inp-titulo" placeholder="Ex: Alfabeto em Libras">
          </div>
          <div class="form-group">
            <label>Link do Vídeo (Embed)</label>
            <input type="text" id="inp-video" placeholder="https://www.youtube.com/embed/...">
          </div>
          <div class="form-group">
            <label>Descrição</label>
            <input type="text" id="inp-descricao" placeholder="O que o aluno vai aprender...">
          </div>
          <div class="form-group">
            <label>Referência ABNT (Opcional)</label>
            <input type="text" id="inp-referencia" placeholder="SILVA, João. 2026.">
          </div>
          <button class="btn btn-dourado" style="width: auto;" id="btn-salvar">Salvar Aula</button>
          <button class="btn" style="background: #E2E8F0; display: none;" id="btn-cancelar">Cancelar Edição</button>
        </div>

        <!-- Tabela -->
        <table>
          <thead>
            <tr>
              <th>Título</th>
              <th>Vídeo</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-aulas">
            <tr><td colspan="3">Carregando dados do Firebase...</td></tr>
          </tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
