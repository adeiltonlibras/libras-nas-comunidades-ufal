<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  .cal-wrap{background:#FFF;border:1px solid #E2E8F0;border-radius:16px;padding:36px;box-shadow:0 10px 30px -5px rgba(0,0,0,.08);}
  .cal-header{margin-bottom:32px;padding-bottom:20px;border-bottom:2px solid #F1F5F9;}
  .cal-badge{display:inline-flex;align-items:center;gap:8px;background:#EFF6FF;color:#1E40AF;padding:5px 12px;border-radius:20px;font-size:0.68rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
  .cal-badge .dot{width:6px;height:6px;background:#F97316;border-radius:50%;}
  .cal-titulo{font-size:1.5rem;font-weight:800;color:#0F172A;margin-bottom:8px;}
  .cal-sub{font-size:0.9rem;color:#64748B;line-height:1.6;}
  .cal-info{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:12px;margin-bottom:36px;}
  .cal-info-item{background:#F8FAFC;border-radius:10px;padding:14px 16px;border-left:3px solid #2563EB;}
  .cal-info-item.roxo{border-left-color:#7C3AED;}
  .cal-info-item.verde{border-left-color:#16A34A;}
  .cal-info-item.laranja{border-left-color:#F97316;}
  .cal-info-item .label{font-size:0.62rem;font-weight:800;color:#64748B;letter-spacing:0.8px;text-transform:uppercase;}
  .cal-info-item .valor{font-size:0.82rem;font-weight:700;color:#0F172A;margin-top:4px;}
  .cal-meses{display:grid;grid-template-columns:repeat(2, 1fr);gap:24px;}
  @media (max-width:900px){.cal-meses{grid-template-columns:1fr;}}
  .cal-mes{background:#FFF;border:1px solid #E2E8F0;border-radius:14px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.04);}
  .cal-mes-titulo{background:linear-gradient(135deg, #0F172A, #1E3A8A);color:#FFF;padding:14px 18px;font-size:0.92rem;font-weight:800;letter-spacing:1px;text-transform:uppercase;text-align:center;}
  .cal-dias-semana{display:grid;grid-template-columns:repeat(7, 1fr);background:#F8FAFC;border-bottom:1px solid #E2E8F0;}
  .cal-dias-semana div{padding:10px 4px;text-align:center;font-size:0.65rem;font-weight:800;color:#64748B;text-transform:uppercase;}
  .cal-dias-semana .dom{color:#DC2626;}
  .cal-grade{display:grid;grid-template-columns:repeat(7, 1fr);gap:2px;padding:8px;background:#F8FAFC;}
  .cal-dia{background:#FFF;border-radius:6px;min-height:68px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;}
  .cal-dia .num{font-size:0.88rem;font-weight:700;color:#0F172A;line-height:1;}
  .cal-dia.dom .num{color:#DC2626;}
  .cal-dia.vazio{background:transparent;}
  .cal-dia .tag{font-size:0.44rem;font-weight:800;line-height:1.1;margin-top:5px;text-transform:uppercase;padding:2px 5px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .cal-dia.inicio{background:linear-gradient(135deg, #16A34A, #22C55E);}
  .cal-dia.inicio .num, .cal-dia.inicio .tag{color:#FFF;}
  .cal-dia.aula{background:linear-gradient(135deg, #2563EB, #3B82F6);}
  .cal-dia.aula .num, .cal-dia.aula .tag{color:#FFF;}
  .cal-dia.meet{background:linear-gradient(135deg, #7C3AED, #8B5CF6);}
  .cal-dia.meet .num, .cal-dia.meet .tag{color:#FFF;}
  .cal-dia.recesso{background:linear-gradient(135deg, #FACC15, #FDE047);}
  .cal-dia.recesso .num{color:#422006;}
  .cal-dia.recesso .tag{color:#713F12;}
  .cal-dia.avaliacao{background:linear-gradient(135deg, #F97316, #FB923C);}
  .cal-dia.avaliacao .num, .cal-dia.avaliacao .tag{color:#FFF;}
  .cal-dia.fim{background:linear-gradient(135deg, #38BDF8, #7DD3FC);}
  .cal-dia.fim .num, .cal-dia.fim .tag{color:#0C2A44;}
  .cal-legenda{margin-top:32px;padding-top:24px;border-top:1px solid #E2E8F0;}
  .cal-legenda h4{font-size:0.72rem;font-weight:800;color:#64748B;letter-spacing:1px;text-transform:uppercase;margin-bottom:14px;}
  .cal-legenda-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(160px, 1fr));gap:10px;}
  .cal-legenda-item{display:flex;align-items:center;gap:10px;font-size:0.78rem;font-weight:600;color:#334155;}
  .cal-legenda-item .sq{width:16px;height:16px;border-radius:4px;flex:0 0 auto;}
</style>
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding:60px 20px;text-align:center;"><h3 style="color:#2563EB;">Carregando calendário...</h3></div>
</div>

<footer class="app-footer">
  <p style="font-size:.8rem;color:#64748B;line-height:1.7;max-width:800px;margin:0 auto;">
    Ferramenta de apoio ao curso · <strong style="color:#0F172A;">Projeto Libras nas Comunidades</strong><br>
    <span style="font-size:.68rem;color:#94A3B8;margin-top:6px;display:inline-block;">Este site não é uma página oficial da UFAL</span><br>
    <span style="font-size:.72rem;color:#475569;margin-top:12px;display:inline-block;padding-top:12px;border-top:1px solid #E2E8F0;">
      💻 Desenvolvido por <strong style="color:#2563EB;">Adeilton Olimpio</strong> · © 2026
    </span>
  </p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="background:#FFF;border-radius:16px;padding:40px;text-align:center;"><h3 style="color:#DC2626;">Erro ao carregar calendário</h3></div>';
    return;
  }

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  if(Array.isArray(D.paginas)){
    const paginas = D.paginas.filter(p => p.publicada !== false).sort((a,b) => (a.ordem||99) - (b.ordem||99));
    let menuHtml = paginas.map(p => {
      const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      const active = p.tipo === 'calendario' ? 'active' : '';
      const isCta = p.slug === 'inscricoes';
      return `<li><a href="${link}" class="${active} ${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
    }).join('');
    menuHtml += `<li><a href="https://sigaa.sig.ufal.br/sigaa/public/extensao/loginCursosEventosExtensao.jsf" target="_blank" rel="noopener" class="btn-inscricao">📋 SIGAA/UFAL</a></li>`;
    document.getElementById('menu').innerHTML = menuHtml;
  }

  const eventos = Array.isArray(D.eventos) ? D.eventos : [];
  const mapaEventos = {};
  eventos.forEach(ev => { mapaEventos[ev.data] = ev; });

  const datas = eventos.map(e => e.data).sort();
  const meses = [];
  if(datas.length > 0){
    const pri = new Date(datas[0] + 'T12:00:00');
    const ult = new Date(datas[datas.length-1] + 'T12:00:00');
    let atual = new Date(pri.getFullYear(), pri.getMonth(), 1);
    const fim = new Date(ult.getFullYear(), ult.getMonth(), 1);
    while(atual <= fim){
      meses.push({ ano: atual.getFullYear(), mes: atual.getMonth() });
      atual.setMonth(atual.getMonth() + 1);
    }
  }

  const nomesMeses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];

  const mesesHtml = meses.map(({ ano, mes }) => {
    const primeiro = new Date(ano, mes, 1);
    const ultimo = new Date(ano, mes + 1, 0);
    const diaInicio = primeiro.getDay();
    const total = ultimo.getDate();

    let celulas = '';
    for(let i = 0; i < diaInicio; i++) celulas += '<div class="cal-dia vazio"></div>';

    for(let d = 1; d <= total; d++){
      const dt = new Date(ano, mes, d);
      const diaSem = dt.getDay();
      const iso = `${ano}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      const ev = mapaEventos[iso];
      let classe = diaSem === 0 ? 'dom' : '';
      let tag = '';
      if(ev){ classe = ev.tipo || 'aula'; tag = ev.rotulo || ''; }

      celulas += `<div class="cal-dia ${classe}"><span class="num">${d}</span>${tag ? `<span class="tag">${esc(tag)}</span>` : ''}</div>`;
    }

    return `<article class="cal-mes"><div class="cal-mes-titulo">${nomesMeses[mes]} ${ano}</div><div class="cal-dias-semana"><div class="dom">DOM</div><div>SEG</div><div>TER</div><div>QUA</div><div>QUI</div><div>SEX</div><div>SÁB</div></div><div class="cal-grade">${celulas}</div></article>`;
  }).join('');

  const TIPOS_INFO = {
    inicio:{label:'Início do Curso',cor:'#16A34A'},
    aula:{label:'Aula Presencial',cor:'#2563EB'},
    meet:{label:'Google Meet',cor:'#7C3AED'},
    avaliacao:{label:'Avaliação',cor:'#F97316'},
    recesso:{label:'Recesso',cor:'#FACC15'},
    feriado:{label:'Feriado',cor:'#475569'},
    cancelado:{label:'Cancelado',cor:'#DC2626'},
    fim:{label:'Encerramento',cor:'#38BDF8'}
  };

  const tiposUsados = new Set(eventos.map(e => e.tipo));
  const legendaItens = Object.keys(TIPOS_INFO).filter(t => tiposUsados.has(t)).map(t => `<div class="cal-legenda-item"><span class="sq" style="background:${TIPOS_INFO[t].cor}"></span>${TIPOS_INFO[t].label}</div>`).join('');

  document.getElementById('app').innerHTML = `
    <div class="cal-wrap">
      <div class="cal-header">
        <div class="cal-badge"><span class="dot"></span>Cronograma Oficial</div>
        <h1 class="cal-titulo">📅 Calendário de Aulas</h1>
        <p class="cal-sub">Visualização mensal das aulas presenciais, atividades assíncronas e encontros pelo Google Meet.</p>
      </div>
      <div class="cal-info">
        <div class="cal-info-item"><div class="label">Período</div><div class="valor">17/10/2026 — 23/01/2027</div></div>
        <div class="cal-info-item roxo"><div class="label">Dias</div><div class="valor">Sábados · 15h às 17h30</div></div>
        <div class="cal-info-item verde"><div class="label">Carga-horária</div><div class="valor">40 horas</div></div>
        <div class="cal-info-item laranja"><div class="label">Encontros</div><div class="valor">15 encontros</div></div>
      </div>
      <div class="cal-meses">${mesesHtml}</div>
      <div class="cal-legenda">
        <h4>Legenda</h4>
        <div class="cal-legenda-grid">${legendaItens}</div>
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
