<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário e Aulas — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding: 60px 20px; text-align: center;">
    <h3 style="color: #2563EB;">Carregando cronograma...</h3>
  </div>
</div>

<footer class="app-footer">
  <p style="font-size:.8rem;color:#64748B;line-height:1.7;max-width:800px;margin:0 auto;">
    Ferramenta de apoio ao curso · <strong style="color:#0F172A;">Projeto Libras nas Comunidades</strong><br>
    <span style="font-size:.68rem;color:#94A3B8;margin-top:6px;display:inline-block;">Este site não é uma página oficial da UFAL</span><br>
    <span style="font-size:.72rem;color:#475569;margin-top:12px;display:inline-block;padding-top:12px;border-top:1px solid #E2E8F0;">
      💻 Desenvolvido por <strong style="color:#2563EB;">Adeilton Olimpio</strong> · © 2026
    </span>
  </p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="background:#FFF;border:1px solid #E2E8F0;border-radius:16px;padding:40px;text-align:center;"><h3 style="color:#DC2626;">Erro ao carregar cronograma</h3></div>';
    return;
  }

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // ============================
  // MENU SUPERIOR
  // ============================
  if(Array.isArray(D.paginas)){
    const paginas = D.paginas
      .filter(p => p.publicada !== false)
      .sort((a,b) => (a.ordem||99) - (b.ordem||99));

    document.getElementById('menu').innerHTML = paginas.map(p => {
      const link = p.tipo === 'calendario'
        ? 'calendario.html'
        : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      const active = p.tipo === 'calendario' ? 'active' : '';
      const isCta = p.slug === 'inscricoes';
      return `<li><a href="${link}" class="${active} ${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
    }).join('') + `
      <li>
        <a href="https://sigaa.sig.ufal.br/sigaa/public/extensao/loginCursosEventosExtensao.jsf"
           target="_blank" rel="noopener" class="btn-inscricao">📋 SIGAA/UFAL</a>
      </li>`;
  }

  // ============================
  // AGRUPAR EVENTOS POR MÊS
  // ============================
  const eventos = Array.isArray(D.eventos)
    ? [...D.eventos].sort((a,b) => a.data.localeCompare(b.data))
    : [];
  const hojeStr = new Date().toISOString().slice(0,10);

  const mesesNome = {
    '01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril',
    '05':'Maio','06':'Junho','07':'Julho','08':'Agosto',
    '09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'
  };

  let listaEventosHtml = '';
  if(eventos.length === 0){
    listaEventosHtml = '<p style="text-align:center;color:#64748B;padding:20px;">Nenhum evento ou aula cadastrado no momento.</p>';
  } else {
    let proximaIdentificada = false;
    let mesAtual = '';

    listaEventosHtml = eventos.map(ev => {
      const [ano, mes, dia] = ev.data.split('-');
      const dataFormatada = `${dia}/${mes}/${ano}`;
      const chaveMes = `${mes}/${ano}`;

      const isProximo = !proximaIdentificada && ev.data >= hojeStr;
      if(isProximo) proximaIdentificada = true;

      // Cabeçalho de mês
      let cabecalhoMes = '';
      if(chaveMes !== mesAtual){
        mesAtual = chaveMes;
        cabecalhoMes = `
          <div style="margin:32px 0 18px; padding-bottom:10px; border-bottom:2px solid #E2E8F0; display:flex; align-items:center; gap:12px;">
            <div style="width:8px; height:8px; background:#F97316; border-radius:50%;"></div>
            <h3 style="font-size:0.95rem; font-weight:800; color:#0F172A; letter-spacing:0.5px; text-transform:uppercase;">
              ${mesesNome[mes]} ${ano}
            </h3>
          </div>
        `;
      }

      const badgeStyle = isProximo
        ? 'background:#2563EB;color:#FFF;'
        : 'background:#F1F5F9;color:#475569;';

      const cardBorder = isProximo
        ? 'border:2px solid #2563EB;box-shadow:0 10px 25px rgba(37,99,235,0.15);'
        : 'border:1px solid #E2E8F0;';

      return cabecalhoMes + `
        <div style="background:#FFF; ${cardBorder} border-radius:14px; padding:20px 22px; margin-bottom:12px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;">
          <div style="display:flex; align-items:center; gap:18px;">
            <div style="${badgeStyle} border-radius:10px; padding:12px 16px; text-align:center; min-width:85px;">
              <div style="font-size:0.65rem; text-transform:uppercase; font-weight:700; opacity:0.9; letter-spacing:0.5px;">
                ${esc(ev.rotulo || 'Aula')}
              </div>
              <div style="font-size:1.05rem; font-weight:800; margin-top:3px;">${dataFormatada}</div>
            </div>
            <div>
              <div style="font-size:0.92rem; font-weight:700; color:#0F172A; margin-bottom:4px;">
                ${esc(ev.descricao)}
              </div>
              <div style="font-size:0.78rem; color:#64748B;">
                🕒 <b>${esc(ev.horario || '15h às 17h30')}</b> &nbsp;•&nbsp; ⏱️ <b>${esc(ev.carga || '2.5')}h</b>
              </div>
            </div>
          </div>
          ${isProximo ? '<span style="background:#EFF6FF; color:#2563EB; padding:5px 12px; border-radius:20px; font-size:0.7rem; font-weight:800; border:1px solid #BFDBFE;">📌 Próximo</span>' : ''}
        </div>
      `;
    }).join('');
  }

  // ============================
  // CABEÇALHO + RENDER FINAL
  // ============================
  document.getElementById('app').innerHTML = `
    <div style="background:#FFF; border:1px solid #E2E8F0; border-radius:16px; padding:40px; box-shadow:0 10px 30px -5px rgba(0,0,0,.08);">

      <!-- Cabeçalho da página -->
      <div style="margin-bottom:28px; padding-bottom:20px; border-bottom:2px solid #F1F5F9;">
        <div style="display:inline-flex; align-items:center; gap:8px; background:#EFF6FF; color:#1E40AF; padding:5px 12px; border-radius:20px; font-size:0.68rem; font-weight:800; letter-spacing:1px; text-transform:uppercase; margin-bottom:14px;">
          <span style="width:6px; height:6px; background:#F97316; border-radius:50%;"></span>
          Cronograma Oficial
        </div>
        <h2 style="font-size:1.4rem; font-weight:800; color:#0F172A; margin-bottom:8px; letter-spacing:-0.3px;">
          📅 Calendário de Aulas
        </h2>
        <p style="font-size:0.88rem; color:#64748B; line-height:1.6;">
          Cronograma das aulas presenciais, atividades assíncronas e encontros pelo Google Meet do curso básico de Libras.
        </p>
      </div>

      <!-- Info resumo -->
      <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; margin-bottom:28px;">
        <div style="background:#F8FAFC; border-radius:10px; padding:14px 16px; border-left:3px solid #2563EB;">
          <div style="font-size:0.62rem; font-weight:800; color:#64748B; letter-spacing:0.8px; text-transform:uppercase;">Período</div>
          <div style="font-size:0.82rem; font-weight:700; color:#0F172A; margin-top:4px;">17/10/2026 — 23/01/2027</div>
        </div>
        <div style="background:#F8FAFC; border-radius:10px; padding:14px 16px; border-left:3px solid #7C3AED;">
          <div style="font-size:0.62rem; font-weight:800; color:#64748B; letter-spacing:0.8px; text-transform:uppercase;">Dias</div>
          <div style="font-size:0.82rem; font-weight:700; color:#0F172A; margin-top:4px;">Sábados · 15h às 17h30</div>
        </div>
        <div style="background:#F8FAFC; border-radius:10px; padding:14px 16px; border-left:3px solid #16A34A;">
          <div style="font-size:0.62rem; font-weight:800; color:#64748B; letter-spacing:0.8px; text-transform:uppercase;">Carga-horária</div>
          <div style="font-size:0.82rem; font-weight:700; color:#0F172A; margin-top:4px;">40 horas</div>
        </div>
        <div style="background:#F8FAFC; border-radius:10px; padding:14px 16px; border-left:3px solid #F97316;">
          <div style="font-size:0.62rem; font-weight:800; color:#64748B; letter-spacing:0.8px; text-transform:uppercase;">Encontros</div>
          <div style="font-size:0.82rem; font-weight:700; color:#0F172A; margin-top:4px;">15 encontros</div>
        </div>
      </div>

      <!-- Lista de eventos -->
      <div>${listaEventosHtml}</div>

      <!-- Rodapé da seção -->
      <div style="margin-top:36px; padding-top:20px; border-top:1px solid #E2E8F0; text-align:center;">
        <p style="font-size:0.72rem; color:#94A3B8; font-style:italic;">
          Última atualização: ${new Date().toLocaleDateString('pt-BR')}
        </p>
      </div>

    </div>
  `;
})();
</script>
</body>
</html>
