<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendário e Aulas — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div style="display:flex; gap:8px; align-items:center;">
      <img src="logo-ufal.png" alt="UFAL" onerror="this.style.display='none'">
      <img src="logo-letras-libras.png" alt="Letras Libras" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding: 60px 20px; text-align: center;">
    <h3 style="color: #2563EB;">Carregando cronograma...</h3>
  </div>
</div>

<footer class="app-footer">
  <p>&copy; 2026 <strong>Universidade Federal de Alagoas (UFAL)</strong> · Projeto de Extensão · Benedito Bentes 3</p>
  <p style="font-size: 0.75rem; color: #94A3B8; margin-top: 6px;">Coordenação: Profa. Dra. Edineide dos Santos Silva | Instrutor: Adeilton Wachill dos Santos Olimpio</p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  }catch(e){
    console.error("Erro ao carregar dados.json:", e);
    document.getElementById('app').innerHTML = '<div style="background:#FFF;border:1px solid #E2E8F0;border-radius:16px;padding:40px;text-align:center;"><h3 style="color:#DC2626;">Erro ao carregar cronograma</h3><p style="margin-top:10px;">Verifique o ficheiro dados.json</p></div>';
    return;
  }

  const S = D.site || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Renderiza menu superior mantendo o padrão das outras páginas
  if(Array.isArray(D.paginas)){
    const paginas = D.paginas.filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
    document.getElementById('menu').innerHTML = paginas.map(p => {
      const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      const active = p.tipo === 'calendario' ? 'active' : '';
      const isCta = p.slug === 'inscricoes';
      return `<li><a href="${link}" class="${active} ${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
    }).join('') + `<li><a href="${esc(S.linkCadastro)}" target="_blank" class="btn-inscricao">📝 SIGAA/UFAL</a></li>`;
  }

  // Processa e ordena os eventos por data
  const eventos = Array.isArray(D.eventos) ? [...D.eventos].sort((a,b) => a.data.localeCompare(b.data)) : [];
  const hojeStr = new Date().toISOString().slice(0,10);

  let listaEventosHtml = '';
  if(eventos.length === 0){
    listaEventosHtml = '<p style="text-align:center;color:#64748B;padding:20px;">Nenhum evento ou aula cadastrado no momento.</p>';
  } else {
    let proximaIdentificada = false;
    listaEventosHtml = eventos.map(ev => {
      const [ano, mes, dia] = ev.data.split('-');
      const dataFormatada = `${dia}/${mes}/${ano}`;
      
      // Identifica o próximo encontro futuro
      const isProximo = !proximaIdentificada && ev.data >= hojeStr;
      if(isProximo) proximaIdentificada = true;

      const badgeStyle = isProximo 
        ? 'background:#2563EB;color:#FFF;' 
        : 'background:#F1F5F9;color:#475569;';

      const cardBorder = isProximo 
        ? 'border:2px solid #2563EB;box-shadow:0 10px 25px rgba(37,99,235,0.15);' 
        : 'border:1px solid #E2E8F0;';

      return `
        <div style="background:#FFF; ${cardBorder} border-radius:16px; padding:24px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px; transition:all 0.2s;">
          <div style="display:flex; align-items:center; gap:20px;">
            <div style="${badgeStyle} border-radius:12px; padding:14px 18px; text-align:center; min-width:90px;">
              <div style="font-size:0.7rem;text-transform:uppercase;font-weight:700;opacity:0.9;">${esc(ev.rotulo || 'Aula')}</div>
              <div style="font-size:1.15rem;font-weight:800;margin-top:2px;">${dataFormatada}</div>
            </div>
            <div>
              <div style="font-size:1rem;font-weight:800;color:#0F172A;margin-bottom:4px;">${esc(ev.descricao)}</div>
              <div style="font-size:0.82rem;color:#64748B;">🕒 Horário: <b>${esc(ev.horario || '15h às 17h')}</b> &nbsp;•&nbsp; ⏱️ Carga: <b>${esc(ev.carga || '2')}h</b> &nbsp;•&nbsp; 📍 Local: Assembleia de Deus (Benedito Bentes 3)</div>
            </div>
          </div>
          ${isProximo ? '<span style="background:#EFF6FF;color:#2563EB;padding:6px 14px;border-radius:20px;font-size:0.75rem;font-weight:800;border:1px solid #BFDBFE;">📌 Próximo Encontro</span>' : ''}
        </div>
      `;
    }).join('');
  }

  document.getElementById('app').innerHTML = `
    <div style="background:#FFF; border:1px solid var(--border); border-radius:var(--radius); padding:40px; box-shadow:var(--shadow);">
      <div style="margin-bottom:28px; border-bottom:2px solid #F1F5F9; padding-bottom:16px;">
        <h2 style="font-size:1.35rem; font-weight:800; color:#0F172A; margin-bottom:6px;">📅 Cronograma de Aulas e Eventos</h2>
        <p style="font-size:0.85rem; color:#64748B;">Acompanhe abaixo o calendário oficial das aulas presenciais do curso básico de Libras.</p>
      </div>
      <div>${listaEventosHtml}</div>
    </div>
  `;
})();
</script>
</body>
</html>
