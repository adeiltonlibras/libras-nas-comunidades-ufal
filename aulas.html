<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <!-- O <head> e o CSS continuam iguais ao estilo YouTube que fizemos antes -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aulas e Materiais — Libras nas Comunidades | UFAL</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style>
    /* (Mantenha todos os estilos .aulas-container, .video-card, etc. da mensagem anterior) */
    .grid-videos { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 32px; max-width: 1140px; margin: 0 auto; padding: 40px 24px; }
    .video-card { background: var(--branco); border-radius: var(--radius); border: 1px solid var(--borda); overflow: hidden; display: flex; flex-direction: column; transition: 0.2s; }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #0F2B4C; }
    .video-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .video-info { padding: 20px; display: flex; flex-direction: column; flex: 1; }
    .video-title { font-family: var(--fonte-titulo); font-size: 1.25rem; color: var(--azul-marinho); margin: 0 0 10px 0; }
    .video-desc { font-size: 0.9rem; color: var(--texto-leve); margin-bottom: 20px; flex: 1; }
    .video-actions { border-top: 1px solid var(--borda); padding-top: 16px; }
    .btn-download { display: inline-flex; align-items: center; gap: 8px; background: var(--off-white); border: 1px solid var(--borda); color: var(--azul-marinho); text-decoration: none; padding: 8px 12px; border-radius: 4px; font-size: 0.8rem; font-weight: 600; margin-bottom: 8px; margin-right: 8px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand"><span class="brand-name">Libras nas Comunidades</span><span class="brand-tag">Projeto de Extensão</span></a>
      <button class="nav-toggle" id="navToggle">Menu</button>
      <nav class="nav-menu" id="navMenu"></nav>
    </div>
  </header>

  <main>
    <div style="text-align: center; padding: 40px 20px 0;"><h1 style="font-family: var(--fonte-titulo); color: var(--azul-marinho);">Aulas e Materiais</h1></div>
    <div id="aulas-list" class="grid-videos"></div>
  </main>

  <footer class="footer"><div class="footer-inner"><div class="footer-brand"><h4>Libras nas Comunidades – UFAL</h4></div></div></footer>

  <!-- O SCRIPT ANTIGO DO GITHUB -->
  <script>
    document.getElementById('navToggle').onclick = () => document.getElementById('navMenu').classList.toggle('active');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, char => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);

    function getIcone(url) {
      const ext = url.split('.').pop().toLowerCase().split(/[?#]/)[0];
      if (['jpg','png','jpeg','gif'].includes(ext)) return '🖼️';
      if (['pdf'].includes(ext)) return '📄';
      if (['ppt','pptx'].includes(ext)) return '📊';
      return '🔗';
    }

    fetch('aulas-dados.json?t=' + Date.now())
      .then(r => r.json())
      .then(data => {
        const container = document.getElementById('aulas-list');
        const aulas = data.aulas || [];
        
        if (aulas.length === 0) {
          container.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Nenhuma aula publicada.</p>';
          return;
        }

        container.innerHTML = aulas.map(aula => {
          const videoHtml = aula.video ? `<div class="video-wrapper"><iframe src="${aula.video}" allowfullscreen></iframe></div>` : '';
          const descHtml = aula.descricao ? `<div class="video-desc">${aula.descricao}</div>` : '';
          
          let matHtml = '';
          if (aula.materiais && aula.materiais.length > 0) {
            matHtml = `<div style="display:flex; flex-wrap:wrap;">` + aula.materiais.map(m => `
              <a href="${m.url}" target="_blank" class="btn-download"><span style="font-size:1.1rem;">${getIcone(m.url)}</span> ${m.titulo}</a>
            `).join('') + `</div>`;
          }

          return `
            <article class="video-card">
              ${videoHtml}
              <div class="video-info">
                <h2 class="video-title">${aula.titulo}</h2>
                ${descHtml}
                <div class="video-actions">${matHtml}</div>
              </div>
            </article>
          `;
        }).join('');
      });
  </script>
</body>
</html>
