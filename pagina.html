<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Página — Libras nas Comunidades</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>
  <div class="topbar"><div class="topbar-inner"><span>Universidade Federal de Alagoas</span><span class="topbar-sep">·</span><span>FALE</span><span class="topbar-sep">·</span><span>PROEXC</span></div></div>
  <header class="header"><div class="header-inner"><a href="index.html" class="brand"><span class="brand-name">Libras nas Comunidades</span><span class="brand-tag">Projeto de Extensão</span></a><button class="nav-toggle" id="navToggle">Menu</button><nav class="nav" id="nav"><ul id="menu"></ul></nav></div></header>

  <main id="main">
    <div id="app"><div style="padding:100px; text-align:center;">Carregando conteúdo...</div></div>
  </main>

  <footer class="footer"><div class="footer-inner"><div><div class="footer-brand-name">Libras nas Comunidades</div><p>Projeto de Extensão da UFAL.</p></div></div><div class="footer-base"><div class="footer-base-inner"><span>Desenvolvido por Adeilton Olimpio</span><span>© 2026 UFAL</span></div></div></footer>

  <script>
    (async function () {
      function urlPagina(p) { if (p.tipo === 'index') return 'index.html'; if (p.tipo === 'calendario') return 'calendario.html'; if (p.tipo === 'externo') return p.arquivo; return `pagina.html?slug=${encodeURIComponent(p.slug)}`; }
      const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      document.getElementById('navToggle').onclick = () => document.getElementById('nav').querySelector('ul').classList.toggle('open');

      try {
        const r = await fetch('dados.json?t=' + Date.now());
        const D = await r.json();
        
        const paginas = D.paginas.filter(p => p.publicada !== false).sort((a,b)=>a.ordem-b.ordem);
        const slug = new URLSearchParams(location.search).get('slug') || 'sobre';
        const atual = paginas.find(p => p.slug === slug) || paginas[0];

        if (atual.tipo === 'externo') { window.location.replace(atual.arquivo); return; }
        if (atual.tipo === 'calendario') { window.location.replace('calendario.html'); return; }
        if (atual.tipo === 'index') { window.location.replace('index.html'); return; }

        document.getElementById('menu').innerHTML = paginas.map(p => {
          const link = urlPagina(p); const active = p.slug === atual.slug ? 'active' : '';
          return `<li><a href="${link}" class="${active}">${esc(p.titulo)}</a></li>`;
        }).join('');

        document.title = `${atual.titulo} — Libras nas Comunidades`;
        document.getElementById('page-title').textContent = document.title;

        document.getElementById('app').innerHTML = `
          <section class="hero hero--compact">
            <div class="hero-pattern"></div>
            <div class="hero-content">
              <div class="breadcrumb"><a href="index.html">Início</a><span>/</span>${esc(atual.titulo)}</div>
              <div class="hero-eyebrow">Projeto de Extensão · UFAL</div>
              <h1 class="hero-title">${esc(atual.titulo)}</h1>
              <div class="hero-rule"></div>
              ${atual.descricao ? `<p class="hero-lede">${esc(atual.descricao)}</p>` : ''}
            </div>
          </section>
          <section class="section">
            <div class="section-inner">
              <div class="article">${atual.html || '<p>Conteúdo em preparação.</p>'}</div>
            </div>
          </section>
        `;
      } catch (e) { document.getElementById('app').innerHTML = '<p style="padding:100px; text-align:center;">Erro ao carregar.</p>'; }
    })();
  </script>
</body>
</html>
