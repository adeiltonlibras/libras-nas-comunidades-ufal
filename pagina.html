<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Página — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding: 60px 20px; text-align: center;">
    <h3 style="color: #2563EB;">Carregando conteúdo...</h3>
  </div>
</div>

<footer class="app-footer">
  <p style="font-size:.8rem;color:#64748B;line-height:1.7;max-width:800px;margin:0 auto;">
    Ferramenta de apoio ao curso · Projeto Libras nas Comunidades<br>
    <span style="font-size:.68rem;color:#94A3B8;margin-top:6px;display:inline-block;">Este site não é uma página oficial da UFAL</span><br>
    <span style="font-size:.72rem;color:#475569;margin-top:12px;display:inline-block;padding-top:12px;border-top:1px solid #E2E8F0;">
      💻 Desenvolvido por <strong style="color:#2563EB;">Adeilton Olimpio</strong> · © 2026
    </span>
  </p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;"><h2>Erro ao carregar dados</h2></div>';
    return;
  }

  const S = D.site || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const urlParams = new URLSearchParams(window.location.search);
  const slugDesejado = urlParams.get('slug') || 'sobre';

  const paginas = (D.paginas || [])
    .filter(p => p.publicada !== false)
    .sort((a,b) => (a.ordem||99) - (b.ordem||99));

  const paginaAtual = paginas.find(p => p.slug === slugDesejado) || paginas[0];

  // ============================
  // MENU SUPERIOR
  // ============================
  document.getElementById('menu').innerHTML = paginas.map(p => {
    const link = p.tipo === 'calendario'
      ? 'calendario.html'
      : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    const active = p.slug === slugDesejado ? 'active' : '';
    const isCta = p.slug === 'inscricoes';
    return `<li><a href="${link}" class="${active} ${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
  }).join('') + `
    <li>
      <a href="https://sigaa.sig.ufal.br/sigaa/public/extensao/loginCursosEventosExtensao.jsf"
         target="_blank" rel="noopener" class="btn-inscricao">📋 SIGAA/UFAL</a>
    </li>`;

  // ============================
  // PÁGINA NÃO ENCONTRADA
  // ============================
  if(!paginaAtual){
    document.getElementById('app').innerHTML = `
      <div style="background:#FFF;border:1px solid #E2E8F0;border-radius:16px;padding:60px 20px;text-align:center;box-shadow:0 10px 30px -5px rgba(0,0,0,.08);">
        <div style="font-size:3rem;margin-bottom:14px;">📄</div>
        <h2 style="color:#0F172A;font-size:1.3rem;margin-bottom:12px;">Página não encontrada</h2>
        <p style="color:#64748B;margin-bottom:20px;">A página que você procura não existe ou foi removida.</p>
        <a href="index.html" style="background:#2563EB;color:#FFF;padding:12px 22px;border-radius:10px;text-decoration:none;font-weight:700;font-size:.85rem;">← Voltar ao Início</a>
      </div>
    `;
    return;
  }

  document.title = `${paginaAtual.titulo} — Libras nas Comunidades`;
  document.getElementById('page-title').textContent = `${paginaAtual.titulo} — Libras nas Comunidades`;

  // ============================
  // RENDER DA PÁGINA
  // ============================
  document.getElementById('app').innerHTML = `
    <div style="background:#FFF; border:1px solid #E2E8F0; border-radius:16px; padding:40px; box-shadow:0 10px 30px -5px rgba(0,0,0,.08);">
      <div style="margin-bottom:24px; padding-bottom:16px; border-bottom:2px solid #F1F5F9;">
        <h1 style="font-size:1.6rem; font-weight:800; color:#0F172A; margin-bottom:8px; letter-spacing:-.3px;">
          ${paginaAtual.icone || '📄'} ${esc(paginaAtual.titulo)}
        </h1>
        ${paginaAtual.descricao ? `<p style="font-size:.9rem; color:#64748B;">${esc(paginaAtual.descricao)}</p>` : ''}
      </div>
      <div class="conteudo-html">
        ${paginaAtual.html || '<p>Sem conteúdo cadastrado.</p>'}
      </div>
    </div>
  `;
})();
</script>
</body>
</html>
