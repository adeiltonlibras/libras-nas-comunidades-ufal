<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página — Libras nas Comunidades | UFAL</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="estilo.css">
  
  <style>
    /* Estilo específico para os textos longos vindos do HTML do JSON */
    .conteudo-html { max-width: 800px; margin: 0 auto; }
    .conteudo-html h2 { font-family: var(--fonte-titulo); font-size: 1.8rem; color: var(--azul-marinho); margin: 40px 0 16px; }
    .conteudo-html h3 { font-family: var(--fonte-titulo); font-size: 1.4rem; color: var(--azul-marinho); margin: 32px 0 12px; }
    .conteudo-html p { font-size: 1.05rem; line-height: 1.8; margin-bottom: 20px; color: var(--texto); }
    .conteudo-html ul, .conteudo-html ol { margin: 0 0 24px 24px; font-size: 1.05rem; line-height: 1.8; }
    .conteudo-html li { margin-bottom: 8px; }
    .conteudo-html a { color: var(--azul-claro); font-weight: 600; text-decoration: underline; }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Pular para o conteúdo</a>

  <header class="header">
    <div class="header-inner">
      <a href="index.html" class="brand" aria-label="Página Inicial">
        <span class="brand-name">Libras nas Comunidades</span>
        <span class="brand-tag">Projeto de Extensão</span>
      </a>
      <button class="nav-toggle" id="navToggle" aria-label="Abrir menu">Menu</button>
      <nav class="nav-menu" id="navMenu">
        <!-- Links injetados via JS -->
      </nav>
    </div>
  </header>

  <main id="main">
    <section class="hero" style="padding: 60px 24px 40px; background: var(--branco); border-bottom: 1px solid var(--borda);">
      <div style="max-width: 800px; margin: 0 auto; text-align: left;">
        <div id="page-eyebrow" class="hero-eyebrow">Carregando...</div>
        <h1 id="page-title" style="font-size: clamp(2rem, 5vw, 3rem); margin-bottom: 16px;">Carregando...</h1>
        <p id="page-desc" style="color: var(--texto-leve); font-size: 1.1rem; margin: 0;"></p>
      </div>
    </section>

    <section class="container" style="padding: 48px 24px 80px;">
      <div class="conteudo-html" id="page-content">
        <!-- HTML da página será injetado aqui -->
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <h4>Libras nas Comunidades – UFAL</h4>
        <p>Conhecimento, comunicação e inclusão.</p>
      </div>
    </div>
    <div class="footer-bottom">
      <p>Desenvolvido por <strong>Adeilton Olimpio</strong></p>
    </div>
  </footer>

  <script>
    document.getElementById('navToggle').onclick = () => document.getElementById('navMenu').classList.toggle('active');

    fetch('dados.json?t=' + Date.now())
      .then(res => res.json())
      .then(D => {
        // 1. Monta o Menu
        const menu = document.getElementById('navMenu');
        if(D.paginas) {
          menu.innerHTML = D.paginas.filter(p => p.publicada !== false).sort((a,b)=>a.ordem-b.ordem).map(p => {
            const link = p.tipo === 'index' ? 'index.html' : p.tipo === 'externo' ? p.arquivo : p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${p.slug}`;
            return `<a href="${link}">${p.titulo}</a>`;
          }).join('');
        }

        // 2. Descobre qual página carregar
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('slug') || 'sobre';
        const pagina = D.paginas.find(p => p.slug === slug);

        if (pagina) {
          document.title = `${pagina.titulo} — Libras nas Comunidades`;
          document.getElementById('page-eyebrow').textContent = 'Projeto de Extensão · UFAL';
          document.getElementById('page-title').textContent = pagina.titulo;
          document.getElementById('page-desc').textContent = pagina.descricao || '';
          document.getElementById('page-content').innerHTML = pagina.html || '<p>Conteúdo em construção.</p>';
        } else {
          document.getElementById('page-title').textContent = 'Página não encontrada';
          document.getElementById('page-desc').textContent = '';
          document.getElementById('page-content').innerHTML = '<p>O conteúdo solicitado não existe ou foi removido.</p>';
        }
      })
      .catch(err => {
        document.getElementById('page-title').textContent = 'Erro de carregamento';
        document.getElementById('page-content').innerHTML = '<p>Não foi possível carregar as informações. Verifique sua conexão.</p>';
      });
  </script>
</body>
</html>
