<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Página — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div style="display:flex; gap:8px; align-items:center;">
      <img src="logo-ufal.png" alt="UFAL">
      <img src="logo-letras-libras.png" alt="Letras Libras">
    </div>
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding: 60px 20px; text-align: center;"><h2>Carregando conteúdo...</h2></div>
</div>

<footer class="app-footer">
  <p>&copy; 2026 <strong>Universidade Federal de Alagoas (UFAL)</strong> · Projeto de Extensão · Benedito Bentes 3</p>
  <p style="font-size: 0.75rem; color: #94A3B8; margin-top: 6px;">Coordenação: Profa. Dra. Edineide dos Santos Silva | Instrutor: Adeilton Wachill dos Santos Olimpio</p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('Erro');
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;"><h2>Erro ao carregar dados</h2></div>';
    return;
  }

  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  const urlParams = new URLSearchParams(window.location.search);
  const slugDesejado = urlParams.get('slug') || 'sobre';

  const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  const paginaAtual = paginas.find(p => p.slug === slugDesejado) || paginas[0];

  if(!paginaAtual){
    document.getElementById('app').innerHTML = '<div style="padding:60px 20px;text-align:center;"><h2>Página não encontrada</h2><a href="index.html" style="color:var(--primary);display:block;margin-top:15px;">← Voltar ao Início</a></div>';
    return;
  }

  document.getElementById('page-title').textContent = `${paginaAtual.titulo} — Libras nas Comunidades`;

  // Renderiza o menu superior mantendo o padrão exato da home
  document.getElementById('menu').innerHTML = paginas.map(p => {
    const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    const active = p.slug === slugDesejado ? 'active' : '';
    const isCta = p.slug === 'inscricoes';
    return `<li><a href="${link}" class="${active} ${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
  }).join('') + `<li><a href="${esc(D.site.linkCadastro)}" target="_blank" class="btn-inscricao">📝 SIGAA/UFAL</a></li>`;

  // Renderiza o conteúdo da página interna dentro do cartão padrão
  document.getElementById('app').innerHTML = `
    <div style="background:#FFF; border:1px solid var(--border); border-radius:var(--radius); padding:40px; box-shadow:var(--shadow);">
      ${paginaAtual.html || '<p>Sem conteúdo cadastrado.</p>'}
    </div>
  `;
})();
</script>
</body>
</html>
