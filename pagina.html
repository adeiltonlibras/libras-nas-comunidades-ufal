<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página — Libras nas Comunidades</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <div class="header-logos">
        <img src="logo-ufal.png" alt="UFAL">
        <div class="divisor"></div>
        <img src="logo-letras-libras.png" alt="Letras Libras">
      </div>
      <div class="header-txt">
        <div class="uni">UFAL · PROEXC · FALE</div>
        <div class="proj">Libras nas Comunidades</div>
      </div>
    </a>
    <button class="menu-toggle" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
    <nav class="header-menu" id="menu"></nav>
    <a href="#" class="header-cta" id="ctaHeader" target="_blank">Inscrever-se →</a>
  </div>
</header>

<div id="app"></div>

<script>
(async function(){
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="container" style="padding:60px 20px;text-align:center;"><h2>Erro</h2></div>';
    return;
  }

  const S = D.site || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

  const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  document.getElementById('menu').innerHTML = paginas.map(p => {
    const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    const active = p.slug === slug ? 'active' : '';
    return `<a href="${link}" class="${active}">${p.icone||''} ${p.titulo}</a>`;
  }).join('');
  document.getElementById('ctaHeader').href = S.linkCadastro || '#';

  const pagina = (D.paginas || []).find(p => p.slug === slug);

  if(!pagina || pagina.publicada === false){
    document.getElementById('app').innerHTML = `
      <div class="container" style="padding:80px 20px;text-align:center;">
        <div style="font-size:3rem;margin-bottom:16px;">📄</div>
        <h2 style="color:#0B2545;font-size:1.5rem;margin-bottom:12px;">Página não encontrada</h2>
        <p style="color:#64748B;margin-bottom:24px;">A página que você procura não existe ou foi removida.</p>
        <a href="index.html" class="btn btn-navy">← Voltar para o início</a>
      </div>`;
    return;
  }

  document.title = pagina.titulo + ' — Libras nas Comunidades';

  const pageHeroHtml = `
    <section class="page-hero">
      <div class="page-hero-inner">
        <div class="breadcrumb"><a href="index.html">Início</a> <span>/</span> <span>${esc(pagina.titulo)}</span></div>
        <h1>${esc(pagina.icone || '📄')} ${esc(pagina.titulo)}</h1>
        ${pagina.descricao ? `<p>${esc(pagina.descricao)}</p>` : ''}
      </div>
    </section>
  `;

  const contentHtml = `
    <div class="page-content">
      <div class="top-actions">
        <button class="btn-pdf" onclick="window.print()">📄 SALVAR PDF</button>
      </div>
      <div class="conteudo-html">
        ${pagina.html || '<p>Esta página ainda não tem conteúdo.</p>'}
      </div>
    </div>
  `;

  const footerHtml = `
    <footer class="footer" style="margin-top:60px;">
      <div class="footer-inner">
        <div class="footer-grid">
          <div>
            <div class="footer-logos">
              <img src="logo-ufal.png" alt="UFAL">
              <img src="logo-letras-libras.png" alt="Letras Libras">
            </div>
            <div class="footer-brand">
              <div class="txt">
                <div class="uni">UFAL · PROEXC · FALE</div>
                <div class="proj">Libras nas Comunidades</div>
              </div>
            </div>
            <p class="footer-desc" style="margin-top:14px;">Projeto de extensão da UFAL para difundir Libras nas comunidades periféricas de Maceió.</p>
          </div>
          <div class="footer-col">
            <h4>📌 Projeto</h4>
            <p><b>Benedito Bentes 3</b></p>
            <p>Código CR096-2026</p>
            <p>Ação de Extensão</p>
          </div>
          <div class="footer-col">
            <h4>👥 Equipe</h4>
            <p><b>Coordenação</b></p>
            <p>Profa. Dra. Edineide Silva</p>
            <p style="margin-top:10px;"><b>Instrutor</b></p>
            <p>Adeilton Wachill Olimpio</p>
          </div>
          <div class="footer-col">
            <h4>🔗 Links</h4>
            <a href="index.html">→ Início</a>
            <a href="calendario.html">→ Calendário</a>
            <a href="${esc(S.linkCadastro || '#')}" target="_blank">→ SIGAA/UFAL</a>
          </div>
        </div>
        <div class="footer-bottom">
          <div>© 2026 <strong>UFAL</strong> · PROEXC · FALE · Todos os direitos reservados</div>
        </div>
      </div>
    </footer>
  `;

  document.getElementById('app').innerHTML = pageHeroHtml + '<div class="container">' + contentHtml + '</div>' + footerHtml;
})();
</script>
</body>
</html>
