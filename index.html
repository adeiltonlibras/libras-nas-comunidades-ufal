<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libras nas Comunidades — Portal do Curso</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div style="display:flex; gap:8px; align-items:center;">
      <img src="logo-ufal.png" alt="UFAL">
      <img src="logo-letras-libras.png" alt="Letras Libras">
    </div>
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app"></div>

<footer class="app-footer">
  <p>&copy; 2026 <strong>Universidade Federal de Alagoas (UFAL)</strong> · Projeto de Extensão · Benedito Bentes 3</p>
  <p style="font-size: 0.75rem; color: #94A3B8; margin-top: 6px;">Coordenação: Profa. Dra. Edineide dos Santos Silva | Instrutor: Adeilton Wachill dos Santos Olimpio</p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('Erro');
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;"><h2>Erro ao carregar dados.json</h2></div>';
    return;
  }

  const S = D.site || {};
  const H = D.home || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Renderiza menu superior
  const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  document.getElementById('menu').innerHTML = paginas.map(p => {
    const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    const isCta = p.slug === 'inscricoes';
    return `<li><a href="${link}" class="${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
  }).join('') + `<li><a href="pagina.html?slug=inscricoes" class="btn-inscricao">📝 Pré-Inscrição</a></li>`;

  // Alerta Inteligente da Próxima Aula
  const hojeStr = new Date().toISOString().slice(0,10);
  const eventosFuturos = (D.eventos || []).filter(e => e.data >= hojeStr).sort((a,b) => a.data.localeCompare(b.data));
  const proximaAula = eventosFuturos.length ? eventosFuturos[0] : null;

  let alertaProximaAulaHtml = '';
  if(proximaAula){
    const [ano, mes, dia] = proximaAula.data.split('-');
    alertaProximaAulaHtml = `
      <div style="background:rgba(37,99,235,0.25);border:1px solid rgba(96,165,250,0.4);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:0.82rem;display:flex;align-items:center;gap:10px;color:#E2E8F0;">
        <span style="font-size:1.2rem;">📌</span>
        <div><b>Próximo Encontro (${dia}/${mes}/${ano}):</b> ${esc(proximaAula.descricao)}</div>
      </div>
    `;
  }

  const dashboardHero = `
    <div class="dashboard-hero">
      <div>
        <div class="hero-badge"><span class="dot"></span> Ação Oficial de Extensão Universitária</div>
        <h1>Curso Básico de Libras<br><span>Nível I — Benedito Bentes 3</span></h1>
        <p>${esc(H.descricao || S.subtitulo)}</p>
        
        ${alertaProximaAulaHtml}

        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <a href="calendario.html" style="background:var(--primary);color:#FFF;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700;font-size:0.85rem;box-shadow:0 4px 15px rgba(37,99,235,0.3);">📅 Ver Cronograma Completo</a>
          <a href="pagina.html?slug=inscricoes" style="background:var(--accent);color:#FFF;padding:12px 24px;border-radius:12px;text-decoration:none;font-weight:700;font-size:0.85rem;box-shadow:0 4px 15px rgba(249,115,22,0.3);">📝 Fazer Pré-Inscrição</a>
        </div>
      </div>
      
      <div class="hero-stats-card">
        <h4 style="color:#FFF;font-size:0.9rem;margin-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.1);padding-bottom:8px;">📌 Detalhes da Turma</h4>
        <div class="stat-row"><span class="stat-label">Período</span><span class="stat-val">${esc(S.periodo)}</span></div>
        <div class="stat-row"><span class="stat-label">Dias</span><span class="stat-val">${esc(S.aulas)}</span></div>
        <div class="stat-row"><span class="stat-label">Horário</span><span class="stat-val">${esc(S.horario)}</span></div>
        <div class="stat-row"><span class="stat-label">Carga Horária</span><span class="stat-val">${esc(S.carga)}h (Certificado UFAL)</span></div>
      </div>
    </div>
  `;

  const cardsGrid = paginas.map(p => {
    const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    return `
      <a href="${link}" class="module-card">
        <div>
          <div class="icon-box">${p.icone || '📂'}</div>
          <h3>${esc(p.titulo)}</h3>
          <p>${esc(p.descricao || 'Acesse o conteúdo detalhado desta seção.')}</p>
        </div>
        <div class="card-footer">Acessar seção →</div>
      </a>
    `;
  }).join('');

  document.getElementById('app').innerHTML = dashboardHero + `
    <div style="margin-top:36px;">
      <h2 class="section-title">⚡ Acesso Rápido aos Módulos e Informações</h2>
      <div class="modules-grid">${cardsGrid}</div>
    </div>
  `;
})();
</script>
</body>
</html>
