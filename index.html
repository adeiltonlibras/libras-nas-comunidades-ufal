<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Libras nas Comunidades: Benedito Bentes 3 — Projeto de Extensão da UFAL">
<title>Libras nas Comunidades — Benedito Bentes 3</title>
<link rel="stylesheet" href="estilo.css">
</head>
<body>

<nav class="nav-top">
  <div class="nav-top-inner" id="menu-top"></div>
</nav>

<div class="container" id="app">
  <div class="loading">
    <div class="spinner"></div>
    <div>Carregando...</div>
  </div>
</div>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = `
      <div class="secao" style="text-align:center;padding:60px 24px;">
        <div style="font-size:2.5rem;margin-bottom:12px;">⚠️</div>
        <h3 style="color:#0B2545;">Erro ao carregar</h3>
        <p style="color:#64748B;font-size:.85rem;margin-top:8px;">Verifique se o arquivo <b>dados.json</b> existe.</p>
      </div>`;
    return;
  }

  const S = D.site || {};
  const H = D.home || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  function renderMenu(atual){
    const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
    const home = `<a href="index.html" class="${atual==='home'?'active':''}">🏠 Início</a>`;
    const links = paginas.map(p => {
      const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      return `<a href="${link}" class="${atual===p.slug?'active':''}">${p.icone||''} ${p.titulo}</a>`;
    }).join('');
    document.getElementById('menu-top').innerHTML = home + links;
  }
  renderMenu('home');

  const heroHtml = `
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-topo">
          <div class="hero-logo">🤟</div>
          <div class="hero-topo-txt">
            <div class="uni">Universidade Federal de Alagoas</div>
            <div class="pro-reit">PROEXC · Faculdade de Letras — FALE</div>
          </div>
        </div>
        <div class="hero-bar"></div>
        <div class="hero-eyebrow">Projeto de Extensão</div>
        <h1 class="hero-titulo">${esc(H.titulo || S.projeto)}</h1>
        <p class="hero-subtitulo">${esc(H.subtitulo || S.curso)}</p>
        <div class="hero-meta">
          <div class="hero-meta-item"><span class="dot"></span><b>Período:</b> ${esc(S.periodo)}</div>
          <div class="hero-meta-item"><span class="dot"></span><b>Aulas:</b> ${esc(S.aulas)}</div>
          <div class="hero-meta-item"><span class="dot"></span><b>Horário:</b> ${esc(S.horario)}</div>
          <div class="hero-meta-item"><span class="dot"></span><b>Carga:</b> ${esc(S.carga)} horas</div>
        </div>
      </div>
    </section>
  `;

  const descricaoHtml = H.descricao ? `
    <div class="secao" style="text-align:center;padding:22px 26px;">
      <p style="font-size:.92rem;color:#334155;line-height:1.6;max-width:820px;margin:0 auto;">${esc(H.descricao)}</p>
    </div>
  ` : '';

  const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  const cardsHtml = paginas.length ? `
    <div class="home-grid">
      ${paginas.map(p => {
        const link = p.tipo === 'calendario' ? 'calendario.html' : 'pagina.html?slug=' + encodeURIComponent(p.slug);
        return `
          <a class="home-card" href="${link}">
            <div class="icone">${esc(p.icone || '📄')}</div>
            <h3>${esc(p.titulo)}</h3>
            <p>${esc(p.descricao || '')}</p>
            <span class="seta">Acessar →</span>
          </a>`;
      }).join('')}
    </div>
  ` : '<p style="text-align:center;color:#64748B;padding:30px;">Nenhuma página disponível.</p>';

  const rodapeHtml = `
    <footer class="rodape">
      <div class="rodape-topo">
        <div class="uni">UNIVERSIDADE FEDERAL DE ALAGOAS</div>
        <div class="pro-reit">Pró-Reitoria de Extensão e Cultura — PROEXC · Faculdade de Letras — FALE</div>
      </div>
      <div class="rodape-corpo">
        <div class="rodape-col">
          <h4>📌 Projeto</h4>
          <p><b>Libras nas Comunidades</b></p>
          <p>Benedito Bentes 3</p>
          <p>Código CR096-2026</p>
        </div>
        <div class="rodape-col">
          <h4>👥 Equipe</h4>
          <p><b>Coordenação</b></p>
          <p>Profa. Dra. Edineide dos Santos Silva</p>
          <p style="margin-top:8px;"><b>Instrutor</b></p>
          <p>Adeilton Wachill dos Santos Olimpio</p>
        </div>
        <div class="rodape-col">
          <h4>🔗 Links úteis</h4>
          <a href="${esc(S.linkCadastro || '#')}" target="_blank" rel="noopener">→ Cadastro no SIGAA/UFAL</a>
          <a href="${esc(S.linkVideo || '#')}" target="_blank" rel="noopener">→ Vídeo passo a passo</a>
          <a href="https://ufal.br" target="_blank" rel="noopener">→ Portal da UFAL</a>
        </div>
      </div>
      <div class="rodape-base">© 2026 <strong>UFAL</strong> · PROEXC · FALE · Todos os direitos reservados</div>
    </footer>
  `;

  document.getElementById('app').innerHTML = heroHtml + descricaoHtml + cardsHtml + rodapeHtml;
})();
</script>
</body>
</html>
