<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Libras nas Comunidades: Benedito Bentes 3 — Projeto de Extensão da UFAL. Curso Básico de Libras – Nível I">
<title>Libras nas Comunidades — Curso Básico de Libras Nível I</title>
<link rel="stylesheet" href="estilo.css">
<!-- Google Fonts Inter -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="header-brand">
      <div class="header-logos">
        <img src="logo-ufal.png" alt="UFAL">
        <div class="divisor"></div>
        <img src="logo-letras-libras.png" alt="Letras Libras">
      </div>
      <div class="header-txt">
        <div class="uni">UFAL · PROEXC · FALE</div>
        <div class="proj">Libras nas Comunidades</div>
      </div>
    </a>
    <button class="menu-toggle" onclick="document.getElementById('menu').classList.toggle('open')">☰</button>
    <nav class="header-menu" id="menu"></nav>
    <a href="#" class="header-cta" id="ctaHeader" target="_blank">Inscrever-se →</a>
  </div>
</header>

<div id="app"></div>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('Erro ao carregar dados');
    D = await r.json();
  }catch(e){
    document.getElementById('app').innerHTML = '<div class="container" style="padding:60px 20px;text-align:center;"><h2>Erro ao carregar dados</h2><p>Verifique se o arquivo dados.json está na raiz do projeto.</p></div>';
    return;
  }

  const S = D.site || {};
  const H = D.home || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Renderiza o menu superior dinamicamente
  const paginas = (D.paginas || []).filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
  document.getElementById('menu').innerHTML = paginas.map(p => {
    const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
    const active = p.slug === 'home' || p.tipo === 'home' ? 'active' : '';
    return `<li><a href="${link}" class="${active}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
  }).join('');
  document.getElementById('ctaHeader').href = S.linkCadastro || '#';

  // Seção Hero da Home
  const heroHtml = `
    <section class="hero">
      <div class="container">
        <div class="hero-inner">
          <div>
            <div class="hero-tag"><span class="dot"></span>Projeto de Extensão Universitária · UFAL</div>
            <h1>${esc(S.curso || 'Curso Básico de Libras')}<br><span>Nível I</span></h1>
            <p>${esc(H.descricao || S.subtitulo)}</p>
            <div class="hero-btns">
              <a href="${esc(S.linkCadastro || '#')}" class="btn btn-primary" target="_blank">📝 Fazer Inscrição no SIGAA</a>
              <a href="calendario.html" class="btn btn-outline">📅 Ver Calendário de Aulas</a>
            </div>
            <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:.85rem;color:#93C5FD;margin-top:20px;">
              <div><b>📍 Período:</b> ${esc(S.periodo)}</div>
              <div><b>🕒 Horário:</b> ${esc(S.aulas)}, ${esc(S.horario)}</div>
            </div>
          </div>
          <div class="hero-card">
            <h3>📋 Informações do Curso</h3>
            <div class="hero-card-list">
              <div class="hero-card-item"><div class="icon">⏱️</div><div class="txt"><div class="label">Carga Horária</div><div class="valor">${esc(S.carga)} horas</div></div></div>
              <div class="hero-card-item"><div class="icon">📍</div><div class="txt"><div class="label">Local das Aulas</div><div class="valor">Assembleia de Deus — BB3</div></div></div>
              <div class="hero-card-item"><div class="icon">🎓</div><div class="txt"><div class="label">Certificação</div><div class="valor">PROEXC / UFAL</div></div></div>
              <div class="hero-card-item"><div class="icon">💚</div><div class="txt"><div class="label">Investimento</div><div class="valor">100% Gratuito</div></div></div>
            </div>
          </div>
        </div>
      </div>
    </section>
  `;

  // Seção de Destaques
  const highlightsHtml = `
    <section class="section section-alt">
      <div class="container">
        <div class="section-header">
          <div style="color:var(--accent);font-weight:800;font-size:0.75rem;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;">Por que participar</div>
          <h2>Aprenda Libras com Metodologia Visual</h2>
          <p class="sub">Um projeto de extensão que une teoria e prática para promover a inclusão na comunidade.</p>
        </div>
        <div class="highlights">
          <div class="highlight"><div class="icon">📚</div><h3>Metodologia Visual</h3><p>Aulas dinâmicas com jogos, recursos visuais e expressões corporais naturais.</p></div>
          <div class="highlight"><div class="icon">👥</div><h3>Comunidade & Inclusão</h3><p>Foco na comunicação cotidiana com surdos no bairro Benedito Bentes 3.</p></div>
          <div class="highlight"><div class="icon">🎓</div><h3>Certificado Oficial</h3><p>Certificação de 40 horas emitida pela Pró-Reitoria de Extensão da UFAL.</p></div>
          <div class="highlight"><div class="icon">✨</div><h3>Totalmente Gratuito</h3><p>Ação universitária sem fins lucrativos aberta à comunidade em geral.</p></div>
        </div>
      </div>
    </section>
  `;

  // Rodapé Institucional
  const footerHtml = `
    <footer class="footer">
      <div class="footer-inner">
        <div class="footer-grid">
          <div>
            <div class="footer-logos">
              <img src="logo-ufal.png" alt="UFAL">
              <img src="logo-letras-libras.png" alt="Letras Libras">
            </div>
            <div class="footer-brand">
              <div class="uni">UFAL · PROEXC · FALE</div>
              <div class="proj">Libras nas Comunidades</div>
            </div>
            <p class="footer-desc" style="margin-top:14px;">Projeto de extensão universitária da Universidade Federal de Alagoas, dedicado a difundir a Língua Brasileira de Sinais em Maceió.</p>
          </div>
          <div class="footer-col">
            <h4>📌 Projeto</h4>
            <p><b>Benedito Bentes 3</b></p>
            <p>Código CR096-2026</p>
            <p>Ação de Extensão</p>
          </div>
          <div class="footer-col">
            <h4>👥 Equipe</h4>
            <p><b>Coordenação</b></p>
            <p>Profa. Dra. Edineide dos Santos Silva</p>
            <p style="margin-top:10px;"><b>Instrutor</b></p>
            <p>Adeilton Wachill dos Santos Olimpio</p>
          </div>
          <div class="footer-col">
            <h4>🔗 Links</h4>
            <a href="index.html">→ Início</a>
            <a href="calendario.html">→ Calendário</a>
            <a href="${esc(S.linkCadastro || '#')}" target="_blank">→ SIGAA/UFAL</a>
          </div>
        </div>
        <div class="footer-bottom">
          <div>&copy; 2026 <strong>UFAL</strong> · PROEXC · FALE · Todos os direitos reservados</div>
          <div class="links">
            <a href="pagina.html?slug=sobre">Sobre</a>
            <a href="pagina.html?slug=equipe">Equipe</a>
            <a href="pagina.html?slug=faq">FAQ</a>
          </div>
        </div>
      </div>
    </footer>
  `;

  document.getElementById('app').innerHTML = heroHtml + highlightsHtml + footerHtml;
})();
</script>
</body>
</html>
