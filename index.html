<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libras nas Comunidades — Portal do Curso</title>
<link rel="stylesheet" href="estilo.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="app-header">
  <a href="index.html" class="app-brand">
    <div style="display:flex; gap:8px; align-items:center;">
      <img src="logo-ufal.png" alt="UFAL" onerror="this.style.display='none'">
      <img src="logo-letras-libras.png" alt="Letras Libras" onerror="this.style.display='none'">
    </div>
    <div>
      <div class="app-title">Libras nas Comunidades</div>
      <div class="app-subtitle">UFAL · FALE · PROEXC</div>
    </div>
  </a>
  <nav class="app-nav" id="menu"></nav>
</header>

<div class="wrapper" id="app">
  <div style="padding: 60px 20px; text-align: center;">
    <h3 style="color: #2563EB;">Carregando informações do portal...</h3>
  </div>
</div>

<footer class="app-footer">
  <p>&copy; 2026 <strong>Universidade Federal de Alagoas (UFAL)</strong> · Projeto de Extensão · Benedito Bentes 3</p>
  <p style="font-size: 0.75rem; color: #94A3B8; margin-top: 6px;">Coordenação: Profa. Dra. Edineide dos Santos Silva | Instrutor: Adeilton Wachill dos Santos Olimpio</p>
</footer>

<script>
(async function(){
  let D;
  try{
    const r = await fetch('dados.json?t=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    D = await r.json();
  }catch(e){
    console.error("Erro ao carregar dados.json:", e);
    return;
  }

  const S = D.site || {};
  const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  // Renderiza menu superior
  if(Array.isArray(D.paginas)){
    const paginas = D.paginas.filter(p => p.publicada !== false).sort((a,b)=>(a.ordem||99)-(b.ordem||99));
    document.getElementById('menu').innerHTML = paginas.map(p => {
      const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      const isCta = p.slug === 'inscricoes';
      return `<li><a href="${link}" class="${isCta ? 'btn-inscricao' : ''}">${p.icone||''} ${esc(p.titulo)}</a></li>`;
    }).join('') + `<li><a href="${esc(S.linkCadastro)}" target="_blank" class="btn-inscricao">📝 SIGAA/UFAL</a></li>`;
  }

  // Alerta Inteligente da Próxima Aula
  let alertaProximaAulaHtml = '';
  if(Array.isArray(D.eventos) && D.eventos.length > 0){
    const hojeStr = new Date().toISOString().slice(0,10);
    const eventosFuturos = D.eventos.filter(e => e.data >= hojeStr).sort((a,b) => a.data.localeCompare(b.data));
    const proximaAula = eventosFuturos.length ? eventosFuturos[0] : null;

    if(proximaAula){
      const [ano, mes, dia] = proximaAula.data.split('-');
      alertaProximaAulaHtml = `
        <div style="background:#EFF6FF; border:1px solid #BFDBFE; border-radius:12px; padding:12px 18px; margin-bottom:24px; font-size:0.85rem; display:flex; align-items:center; gap:10px; color:#1E3A8A;">
          <span style="font-size:1.2rem;">📌</span>
          <div><b>Próximo Encontro (${dia}/${mes}/${ano}):</b> ${esc(proximaAula.descricao)}</div>
        </div>
      `;
    }
  }

  // Substituição do banner azul antigo pelo seu banner oficial personalizado
  const bannerHeroHtml = `
    <div style="margin-bottom:36px;">
      <div style="width:100%; overflow:hidden; border-radius:20px; box-shadow:0 15px 35px rgba(11,37,69,0.12); background:#0B2545;">
        <img src="arte-formulario.png" alt="Curso de Libras Básico I - Adeilton Wachill" style="width:100%; height:auto; display:block; object-fit:cover; max-height:420px;">
      </div>
    </div>
  `;

  let cardsGrid = '';
  if(Array.isArray(D.paginas)){
    cardsGrid = D.paginas.filter(p => p.publicada !== false).map(p => {
      const link = p.tipo === 'calendario' ? 'calendario.html' : `pagina.html?slug=${encodeURIComponent(p.slug)}`;
      return `
        <a href="${link}" class="module-card">
          <div>
            <div class="icon-box">${p.icone || '📂'}</div>
            <h3>${esc(p.titulo)}</h3>
            <p>${esc(p.descricao || 'Acesse o conteúdo detalhado desta seção.')}</p>
          </div>
          <div class="card-footer">Acessar seção →</div>
        </a>
      `;
    }).join('');
  }

  document.getElementById('app').innerHTML = bannerHeroHtml + alertaProximaAulaHtml + `
    <div>
      <h2 class="section-title">⚡ Acesso Rápido aos Módulos e Informações</h2>
      <div class="modules-grid">${cardsGrid}</div>
    </div>
  `;
})();
</script>
</body>
</html>
